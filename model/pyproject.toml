[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualview-gas-tomography"
version = "1.3.0"
description = "Scene-configurable gas concentration tomography with calibrated cameras, sparse Siddon ray tracing, Huber-TV and temporal regularization."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{name = "OpenAI"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "opencv-python>=4.8,<5",
  "numba>=0.59,<1",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
  "scikit-image>=0.22,<1",
  "plotly>=5.20,<7",
  "tifffile>=2024.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
gas-tomo = "gas_tomo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.package-data]
gas_tomo = ["web_assets/*.html", "web_assets/*.js"]
